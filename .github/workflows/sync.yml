name: Synchronize public metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: read
concurrency:
  group: data-publication
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Record job budget start
        run: echo "ARGUS_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_distribution.py
      - run: python -m unittest discover -s tests -v
      - name: Collect and atomically publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARGUS_COLLECT_SECONDS: '480'
        run: python -m sync.run --repository argus-poc-index ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run-report
          path: .work/run-report.json
          retention-days: 7
          if-no-files-found: warn
