name: Sync data
on:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional source id (blank runs all sources)'
        required: false
        type: string
      limit:
        description: 'Optional per-source budget override for smoke/backfill'
        required: false
        type: string

permissions:
  contents: write
concurrency:
  group: data-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
      VULNERS_API_KEY: ${{ secrets.VULNERS_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install -r requirements.txt
      - name: Test collectors and persistence
        run: python -m unittest discover -s tests -v
      - name: Restore previous release and collect
        id: collect
        env:
          SELECTED_SOURCE: ${{ inputs.source }}
          ITEM_LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY'
          import os, subprocess
          command = ['python', 'scripts/sync.py', '--restore']
          if os.environ.get('SELECTED_SOURCE'):
              command += ['--source', os.environ['SELECTED_SOURCE']]
          if os.environ.get('ITEM_LIMIT'):
              command += ['--limit', os.environ['ITEM_LIMIT']]
          subprocess.run(command, check=True)
          PY
      - name: Publish verified data version
        if: steps.collect.outputs.publish == 'true'
        run: python scripts/publish.py
      - name: Report source failures
        if: steps.collect.outputs.failed == 'true'
        run: |
          python -c 'raise SystemExit("One or more feeds failed; see source status. Successful feeds were published.")'
